server {
    listen 80;
    server_name pve.972154847.asia;

    # certbot 验证用（重要：Let's Encrypt 需要访问 /.well-known）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 请求强制重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pve.972154847.asia;

    ssl_certificate     /etc/letsencrypt/live/pve.972154847.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pve.972154847.asia/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传文件大小限制（单张照片 ≤5MB，多文件上传预留）
    client_max_body_size 15m;

    # ========== 后端 API ==========
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 对话接口需要更长的超时时间
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ========== 上传文件静态托管 ==========
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
